name: WASM relinker

on:
  push:
    branches:
      - test/wasm-relinker-ci-probe-20261030
  pull_request:
    paths:
      - .github/workflows/wasm-relinker.yml
      - CMakeLists.txt
      - core/relinker/**
      - tools/build_web.py
      - tools/test_web.py

permissions:
  contents: read

concurrency:
  group: wasm-relinker-probe-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test web converter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build web converter
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.3
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.3
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-wasm -DANYPS5_BUILD_WASM=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --target relinker_web --parallel 2
      - name: Test web converter
        run: python3 tools/test_web.py --build build-wasm
